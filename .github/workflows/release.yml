# Cutting a release.
#
# One tag produces everything: six binaries, their checksums, a GitHub release
# carrying the install script, and seven npm packages. Nothing here is
# assembled by hand, because a release assembled half by a workflow and half
# by a person is a release that differs between one version and the next.
#
# One thing is still done by a person, on purpose. The npm packages are staged,
# not published: they wait on the registry until a maintainer approves each of
# them with two-factor authentication. The token this workflow holds cannot
# put a version in front of users on its own, so a leaked token cannot either.
#
# The tag is the version. v0.2.0 builds a CLI that reports 0.2.0, and there is
# no second place to update.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Staging is newer than the npm this Node ships with. Checked here, so a
      # runner without it stops before anything is built, not at the last step.
      - name: Use an npm that can stage
        run: |
          set -eu
          npm install -g npm@11.20.0
          npm stage --help >/dev/null

      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Everything below is built from this one loop, so a target cannot be
      # released in one form and forgotten in the other.
      - name: Build every target
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          mkdir -p dist

          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="outplane"
            [ "$os" = "windows" ] && name="outplane.exe"

            out="build/${os}_${arch}"
            mkdir -p "$out"

            # -s -w drop the symbol table and DWARF: nothing debugs a released
            # binary from a stack trace, and it is a third of the size.
            GOOS=$os GOARCH=$arch go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out/$name" ./cmd/outplane

            archive="outplane_${GITHUB_REF_NAME}_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd "$out" && zip -q "../../dist/${archive}.zip" "$name")
            else
              tar -czf "dist/${archive}.tar.gz" -C "$out" "$name"
            fi
          done

      # The install script verifies against this before running anything it
      # downloaded, so it ships with the release rather than alongside it.
      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > checksums.txt
          # sha256sum writes "./name"; the install script greps for " name".
          sed -i 's|\./||' checksums.txt
          cat checksums.txt

      # Re-runnable, because the reason to re-run is that something after this
      # step failed. A release that already exists has its assets replaced
      # rather than the workflow stopping on a name that is taken.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* install.sh --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/* install.sh
          fi

      # Six platform packages and one wrapper. The wrapper depends on all six
      # optionally, with os and cpu set, so npm installs exactly the one that
      # matches and nothing has to download anything after the fact.
      - name: Assemble the npm packages
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu

          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="outplane"
            [ "$os" = "windows" ] && name="outplane.exe"

            # npm's own names for the same things.
            npm_os=$os
            [ "$os" = "windows" ] && npm_os="win32"
            npm_cpu=$arch
            [ "$arch" = "amd64" ] && npm_cpu="x64"

            pkg="npm-dist/cli-${os}-${arch}"
            mkdir -p "$pkg/bin"
            cp "build/${os}_${arch}/$name" "$pkg/bin/$name"
            chmod +x "$pkg/bin/$name"

            cat > "$pkg/package.json" <<EOF
          {
            "name": "@outplane/cli-${os}-${arch}",
            "version": "${VERSION}",
            "description": "Out Plane CLI binary for ${os} ${arch}",
            "license": "Apache-2.0",
            "repository": { "type": "git", "url": "git+https://github.com/outplane/cli.git" },
            "os": ["${npm_os}"],
            "cpu": ["${npm_cpu}"],
            "files": ["bin"]
          }
          EOF
          done

          mkdir -p npm-dist/cli/bin
          cp npm/bin/outplane npm-dist/cli/bin/outplane
          chmod +x npm-dist/cli/bin/outplane
          # The package page has its own README: somebody arriving from npm has
          # already chosen the channel, and the first thing they need is not a
          # list of the other ones.
          cp npm/README.md npm-dist/cli/README.md
          cp LICENSE npm-dist/cli/

          cat > npm-dist/cli/package.json <<EOF
          {
            "name": "outplane",
            "version": "${VERSION}",
            "description": "Deploy and operate applications on Out Plane",
            "license": "Apache-2.0",
            "repository": { "type": "git", "url": "git+https://github.com/outplane/cli.git" },
            "homepage": "https://docs.outplane.com/cli",
            "bin": { "outplane": "bin/outplane" },
            "files": ["bin", "README.md", "LICENSE"],
            "engines": { "node": ">=18" },
            "optionalDependencies": {
              "@outplane/cli-darwin-amd64": "${VERSION}",
              "@outplane/cli-darwin-arm64": "${VERSION}",
              "@outplane/cli-linux-amd64": "${VERSION}",
              "@outplane/cli-linux-arm64": "${VERSION}",
              "@outplane/cli-windows-amd64": "${VERSION}",
              "@outplane/cli-windows-arm64": "${VERSION}"
            }
          }
          EOF

      # The platform packages go first. The wrapper depends on them, and a
      # wrapper that is live before the versions it points at is an install
      # that fails for whoever is quickest. The same order holds for approval.
      - name: Stage the packages on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ORG_SECRET }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu

          # A version already on the registry, live or staged, is skipped
          # rather than retried. npm refuses the same version twice, and this
          # workflow has to survive being run again after failing part way:
          # that is what a re-run is for. A listing that fails is not read as
          # "not staged" in silence; staging again then fails on the conflict.
          waiting() {
            name=$(node -p "require('./package.json').name")
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${name}@${VERSION} is already published"
              return 1
            fi
            if ! staged=$(npm stage list "${name}" --json 2>/dev/null); then
              echo "::warning::could not list the staged versions of ${name}"
              return 0
            fi
            hit=$(printf '%s' "$staged" | NAME="$name" node -e '
              let items = []
              try { items = JSON.parse(require("fs").readFileSync(0, "utf8")) } catch {}
              const list = Array.isArray(items) ? items : []
              const found = list.some(i => i.packageName === process.env.NAME && i.version === process.env.VERSION)
              console.log(found ? "yes" : "no")
            ')
            if [ "$hit" = yes ]; then
              echo "${name}@${VERSION} is already staged"
              return 1
            fi
            return 0
          }

          # npm will not put a prerelease on latest by itself, and the tag a
          # version is staged with cannot be changed afterwards. Only a
          # prerelease gets one, so npm still refuses to move latest backwards.
          tag=
          case "$VERSION" in *-*) tag=next ;; esac
          stage() { npm stage publish --access public ${tag:+--tag "$tag"} "$@"; }

          # A rehearsal first. A package that does not pack, or a version npm
          # would refuse, fails here rather than after three packages are
          # already staged and the fourth is not. It proves nothing about the
          # token: a dry run never asks the registry to write.
          for dir in npm-dist/cli-* npm-dist/cli; do
            (cd "$dir" && if waiting; then stage --dry-run; fi)
          done

          for dir in npm-dist/cli-* npm-dist/cli; do
            (cd "$dir" && if waiting; then stage; fi)
          done

      # The new version is not installable from npm until a maintainer approves
      # it, so the run says so where it will be read. Only ids, names and
      # versions are printed: the summary of a public repository is public. A
      # listing that fails does not fail the release, the packages are staged.
      - name: Say what waits for approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ORG_SECRET }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          {
            echo "## npm: ${VERSION} is staged, not published"
            echo
            echo "A maintainer approves each package with two-factor authentication,"
            echo "in this order: the six platform packages first, \`outplane\` last."
            echo "Until then npm installs stay on the previous version, so raise the"
            echo "recommended version only after the last approval."
            echo
            echo '```'
            for dir in npm-dist/cli-* npm-dist/cli; do
              name=$(node -p "require('./${dir}/package.json').name")
              npm stage list "${name}" --json 2>/dev/null | NAME="$name" node -e '
                let items = []
                try { items = JSON.parse(require("fs").readFileSync(0, "utf8")) } catch {}
                const hit = Array.isArray(items) && items.find(i => i.packageName === process.env.NAME && i.version === process.env.VERSION)
                console.log(hit
                  ? "npm stage approve " + hit.id + "   # " + process.env.NAME
                  : "# " + process.env.NAME + "@" + process.env.VERSION + ": not in the staged list")
              ' || echo "# ${name}: could not list"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
